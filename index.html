/* ============================================================
 * 考点体系 POINTS：23 个逻辑填空核心考点
 * ============================================================ */
const POINTS=["语境对应·关键词定位","语境对应·中心话题","语境对应·解释说明","逻辑关联·反义对应","逻辑关联·并列对应","逻辑关联·递进关系","逻辑关联·因果关系","逻辑关联·条件关系","多对一·全匹配验证","成语辨析·本义区分","成语辨析·拆分对应","成语辨析·感情色彩","成语辨析·语义轻重","实词辨析·语义侧重","实词辨析·搭配对象","实词辨析·程度与范围","选项呼应·自洽性","主体视角·角色对应","目的/结果/措施区分","比喻/修辞对应","高频复现词统计","语句衔接·承上启下","常识/背景对应","标点/符号提示","语句排序·首句与捆绑","细节判断·六类偷换"];
/* ============================================================
 * 状态与存储
 * ============================================================ */
const LS_KEY="yy_lk_v1";
let S={view:"setup",setup:{years:[2021,2022,2023,2024,2025,2026],count:15,points:POINTS.map(p=>p)},quiz:[],cur:0,answers:[],unc:[],t0:0,timer:null,secs:0,done:false};
function load(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){return null}}
function save(){localStorage.setItem(LS_KEY,JSON.stringify({h:S.h||[],w:S.w||{}}))}
let D=load();S.h=D&&D.h||[];S.w=D&&D.w||{};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){if(!s&&s!==0)return"-";let m=Math.floor(s/60),x=s%60;return m+"分"+String(x).padStart(2,"0")+"秒"}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function qHtml(q){return esc(q).replace(/____/g,'<span style="display:inline-block;min-width:52px;border-bottom:2px solid var(--accent);text-align:center;font-weight:800;color:var(--accent)">　</span>')}
function ptOf(p){let i=POINTS.indexOf(p);return i>=0?i:0}
function ringHTML(rate){
  let r=52,C=2*Math.PI*r,off=C*(1-rate);
  let col=rate>=0.8?"#16a34a":rate>=0.6?"#d97706":"#dc2626";
  return '<div class="score-ring"><svg width="128" height="128" viewBox="0 0 128 128"><circle cx="64" cy="64" r="'+r+'" fill="none" stroke="#e2e8f0" stroke-width="11"/><circle cx="64" cy="64" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'"/></svg><div class="inner"><div class="num">'+Math.round(rate*100)+'</div><div class="unit">正确率 %</div></div></div>';
}
/* ============================================================
 * 视图渲染
 * ============================================================ */
const app=document.getElementById("app");
document.getElementById("nav").addEventListener("click",e=>{
  let b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  S.view=b.dataset.view;render();
});
function render(){
  if(S.view==="setup")renderSetup();
  else if(S.view==="quiz")renderQuiz();
  else if(S.view==="result")renderResult();
  else if(S.view==="atlas")renderAtlas();
  else if(S.view==="stats")renderStats();
  else if(S.view==="wrong")renderWrong();
}
function filtered(){
  let ys=new Set(S.setup.years);
  return QB.filter(q=>ys.has(q.yr)&&new Set(S.setup.points).has(q.point));
}
/* ===== 设置页 ===== */
function renderSetup(){
  let ys=[2021,2022,2023,2024,2025,2026];
  let yOpt=ys.map(y=>'<label class="opt'+(S.setup.years.includes(y)?" sel":"")+'"><input type="checkbox" data-y="'+y+'"'+(S.setup.years.includes(y)?" checked":"")+'>'+y+' 年</label>').join("");
  let cntOpt=[10,15,20,25,30,QB.length].map(n=>'<label class="opt'+(S.setup.count===n?" sel":"")+'"><input type="radio" name="cnt" data-c="'+n+'"'+(S.setup.count===n?" checked":"")+'>'+(n>=QB.length?"全部 "+QB.length+" 题":n+" 题")+'</label>').join("");
  let pOpt=POINTS.map((p,i)=>'<label class="point-item'+(S.setup.points.includes(p)?" sel":"")+'"><input type="checkbox" data-p="'+i+'"'+(S.setup.points.includes(p)?" checked":"")+'>'+p+'</label>').join("");
  let f=filtered();
  app.innerHTML=
  '<div class="card"><h2><span class="bar"></span>练习设置</h2>'+
  '<div class="set-grid">'+
    '<div class="set-card"><h3>真题来源（年份）</h3><div class="opt-row">'+yOpt+'</div></div>'+
    '<div class="set-card"><h3>每组题量</h3><div class="opt-row">'+cntOpt+'</div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><h2><span class="bar"></span>考点筛选（26 个考点全覆盖）</h2>'+
  '<div class="point-grid">'+pOpt+'</div>'+
  '<div class="sum-bar">已选 <b>'+S.setup.points.length+'</b> 个考点，覆盖 <b>'+f.length+'</b> 道题目</div>'+
  '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">'+
    '<button class="btn btn-primary" id="startBtn"'+(f.length? "":" disabled")+'>开始练习（'+Math.min(S.setup.count,f.length)+' 题随机组卷）</button>'+
    '<button class="btn btn-ghost" id="allPt">全选考点</button>'+
    '<button class="btn btn-ghost" id="clrPt">清空考点</button>'+
  '</div></div>'+
  '<details class="kp" open><summary>命题人视角 · 逻辑填空干扰项设计规律 + 秒杀方法论（做题前先读）</summary><div class="kp-body">'+
  '<h4>一、命题人如何设置干扰项（五大规律）</h4>'+
  '<table><tr><th style="width:22%">规律</th><th>命题手法与识别要点</th></tr>'+
  '<tr><td>1. 对应错位</td><td>把“结果”与“举措/制度”混装：题干横线指措施，干扰项却对应结果（如环评题“预警机”）。解法：先锁定横线到底修饰什么。</td></tr>'+
  '<tr><td>2. 程度轻重</td><td>用“杜绝/绝对/无策”等过重词设陷（史书题“杜绝造假”），或“缓解/降低”等过轻词。解法：对照语境是“二次检验”还是“完全封死”。</td></tr>'+
  '<tr><td>3. 同义重复自洽</td><td>干扰项内部两个词互相重复，读起来“顺”但逻辑颠倒（读书题“肤浅地浏览→走马观花”）。解法：把选项词带回原句检验是否同义堆叠。</td></tr>'+
  '<tr><td>4. 字面/常识偷换</td><td>用成语表面字义或日常联想偷换本义（退避三舍=主动退让并无害怕义；“海市蜃楼”非思想层面）。解法：按成语本义而非望文生义。</td></tr>'+
  '<tr><td>5. 多空拆散混装</td><td>把正确项的三空分别混入 A/B/C，靠“整体取舍”验证（守正创新题“返璞归真”）。解法：多空题必须三个空整体代入，不能只看一空。</td></tr></table>'+
  '<h4>二、超格莫等闲解题十法（对应定位优先）</h4>'+
  '<ul class="tip-list">'+
  '<li>1. 对应定位第一：先问横线对应“举措/制度本身”还是“结果”，对应错了全盘皆错。</li>'+
  '<li>2. 成语拆分对应：把成语拆成词素逐一对语境（殊途=两类方式，同归=同一结果）。</li>'+
  '<li>3. 中心/话题对应：横线前后无明显对应时，回到全文中心句（从严治党→立规矩）。</li>'+
  '<li>4. 逻辑关联词定方向：转折看反义、并列看近义、递进看加深、因果看推论。</li>'+
  '<li>5. 多对一全匹配：题干给出多个条件（诱因/主体）时，选项必须全部能对应。</li>'+
  '<li>6. 并列/近义辨析：顿号、分号、排比前后的词构成同义或近义场。</li>'+
  '<li>7. 成语本义“区别于”：食古不化=学古不消化≠守旧；退避三舍=主动退让≠畏惧。</li>'+
  '<li>8. 高频统计与固定搭配：“剥离”8次7对；不可篡改、望而却步等高频固定搭配。</li>'+
  '<li>9. 转折会消失论：若干扰项成立则作者无需转折，转折处必是前后对立。</li>'+
  '<li>10. 目的/结果区分：横线前已“直面真问题”，横线处应表目的（破解）而非重复（洞见）。</li>'+
  '</ul>'+
  '<h4>三、语句表达题型速查（排序 / 细节 / 标点）</h4>'+
  '<table><tr><th style="width:22%">题型</th><th>命题视角与解题要点</th></tr>'+
  '<tr><td>语句排序</td><td>首句判定优先：含“但/然而/因此/总之”等关联词或含指代（这/它）的句子不作首句；次看捆绑：同话题词（如“风险”“牛鼻子”）就近捆绑、关联词定句内顺序；再验结构：“总—分—总”时首句点题、尾句总结回扣。</td></tr>'+
  '<tr><td>细节判断</td><td>六类偷换：时态（已/将）、数量（部分/全部）、范围（个别/普遍）、程度（可能/必然）、逻辑（因果/并列错置）、主客体（谁对谁）。本题最典型：把“显示潜力”偷换为“能够减缓”、把“活性降低”偷换为“抑制发生”、把间接机制偷换成直接因果。</td></tr>'+
  '<tr><td>标点提示</td><td>冒号=后文解释前文，分号=并列对照，顿号=同向列举，破折号=补充说明。横线后紧跟冒号时，冒号后内容即横线释义（作业管理题三组分号排比、红树林题“既节流又开源”）。</td></tr></table>'+
  '</div></details>';
  document.getElementById("startBtn").onclick=startQuiz;
  document.getElementById("allPt").onclick=()=>{S.setup.points=POINTS.slice();render()};
  document.getElementById("clrPt").onclick=()=>{S.setup.points=[];render()};
  document.querySelectorAll("[data-y]").forEach(c=>c.onchange=()=>{
    let y=+c.dataset.y;if(c.checked){if(!S.setup.years.includes(y))S.setup.years.push(y)}else S.setup.years=S.setup.years.filter(v=>v!==y);render()});
  document.querySelectorAll("[data-c]").forEach(c=>c.onchange=()=>{S.setup.count=+c.dataset.c;render()});
  document.querySelectorAll("[data-p]").forEach(c=>c.onchange=()=>{
    let p=POINTS[+c.dataset.p];if(c.checked){if(!S.setup.points.includes(p))S.setup.points.push(p)}else S.setup.points=S.setup.points.filter(v=>v!==p);render()});
}
/* ===== 开始练习 ===== */
function startQuiz(pool){
  if(!(pool instanceof Array))pool=undefined;/* 事件对象等非数组入参一律忽略，防 onclick 直绑传入 Event */
  let f=pool||filtered();
  if(!f.length)return;
  let n=Math.min(S.setup.count,f.length);
  S.quiz=shuffle(f).slice(0,n);
  S.cur=0;S.answers=[];S.unc=[];S.done=false;S.secs=0;
  S.view="quiz";
  clearInterval(S.timer);
  S.t0=Date.now();
  S.timer=setInterval(()=>{S.secs=Math.floor((Date.now()-S.t0)/1000);let t=document.getElementById("timer");if(t)t.textContent=fmt(S.secs);},1000);
  document.querySelectorAll("#nav button").forEach(x=>{x.classList.toggle("active",x.dataset.view==="quiz")});
  render();
}
/* ===== 答题页 ===== */
function renderQuiz(){
  let q=S.quiz[S.cur],idx=S.cur;
  let opts=q.opts.map((o,i)=>{
    let ch=S.answers[idx]===i?" chosen":"";
    return '<label class="option'+ch+'"><input type="radio" name="opt" data-i="'+i+'"'+(S.answers[idx]===i?" checked":"")+'><span class="k">'+String.fromCharCode(65+i)+'.</span><span class="t">'+esc(o)+'</span></label>';
  }).join("");
  app.innerHTML=
  '<div class="quiz-top"><div><div style="font-size:13px;color:var(--sub)">第 '+(idx+1)+' / '+S.quiz.length+' 题 · '+(q.yr)+' 国考</div><div class="progress"><i style="width:'+((idx+1)/S.quiz.length*100)+'%"></i></div></div><div class="timer" id="timer">'+fmt(S.secs)+'</div></div>'+
  '<div class="q-card"><div class="q-head"><div class="q-num">'+(idx+1)+'</div><div style="flex:1"><div class="q-text">'+qHtml(q.q)+'</div><div class="q-meta"><span class="badge point">'+q.point+'</span><span class="badge zhen">'+q.src+'</span></div></div></div>'+
  '<div class="options">'+opts+'</div>'+
  '<div class="uncertain-row"><input type="checkbox" id="unc"'+(S.unc[idx]?" checked":"")+'> 本题不确定（不计入自信题，判分后重点回看）</div>'+
  '<div class="quiz-actions">'+
    (idx>0?'<button class="btn btn-ghost" id="prevQ">上一题</button>':"")+
    (idx<S.quiz.length-1?'<button class="btn btn-blue" id="nextQ">下一题</button>':'<button class="btn btn-primary" id="finishQ">交卷判分</button>')+
    '<button class="btn btn-ghost" id="quitQ">退出练习</button>'+
  '</div></div>';
  document.querySelectorAll(".option").forEach(l=>l.onclick=()=>{S.answers[idx]=+l.querySelector("input").dataset.i;render()});
  let uc=document.getElementById("unc");uc.onchange=()=>{S.unc[idx]=uc.checked};
  let nq=document.getElementById("nextQ");if(nq)nq.onclick=()=>{S.cur++;render()};
  let pq=document.getElementById("prevQ");if(pq)pq.onclick=()=>{S.cur--;render()};
  let fq=document.getElementById("finishQ");if(fq)fq.onclick=submit;
  document.getElementById("quitQ").onclick=()=>{clearInterval(S.timer);S.view="setup";document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active",x.dataset.view==="setup"));render()};
}
/* ===== 交卷判分 ===== */
function submit(){
  clearInterval(S.timer);
  let wrongIds=[],cor=0;
  S.quiz.forEach((q,i)=>{if(S.answers[i]===q.ans)cor++;else wrongIds.push(QB.indexOf(q))});
  let rec={t:Date.now(),total:S.quiz.length,correct:cor,secs:S.secs,ids:wrongIds,years:[...new Set(S.quiz.map(q=>q.yr))],qids:S.quiz.map((q,i)=>[QB.indexOf(q),S.answers[i]===q.ans])};
  S.h.push(rec);S.h=S.h.slice(-60);
  wrongIds.forEach(id=>{S.w[id]=(S.w[id]||0)+1});
  save();
  S.result=rec;S.done=true;S.view="result";
  document.querySelectorAll("#nav button").forEach(x=>{x.classList.toggle("active",x.dataset.view==="result")});
  render();
}
/* ===== 结果页 ===== */
function renderResult(){
  let r=S.result,rate=r.correct/r.total;
  let rows=S.quiz.map((q,i)=>{
    let ok=S.answers[i]===q.ans;
    return '<div class="review-row" data-ridx="'+i+'"><span class="st '+(ok?"ok":"no")+'">'+(ok?"对":"错")+'</span><span class="tt">'+(i+1)+'. '+esc(q.q.slice(0,26))+'…</span><span class="pt">'+q.point+'</span></div>';
  }).join("");
  app.innerHTML=
  '<div class="card"><h2><span class="bar"></span>本次成绩</h2>'+
  '<div class="result-hero">'+ringHTML(rate)+
  '<div class="result-stats">'+
    '<div class="rstat"><div class="v">'+r.correct+'/'+r.total+'</div><div class="l">答对 / 总题数</div></div>'+
    '<div class="rstat"><div class="v">'+fmt(r.secs)+'</div><div class="l">用时</div></div>'+
    '<div class="rstat"><div class="v '+(r.correct>=r.total*0.8?"green":"red")+'">'+(r.correct>=r.total*0.8?"稳":"补")+'</div><div class="l">'+(r.correct>=r.total*0.8?"优秀档":"待提升档")+'</div></div>'+
  '</div></div>'+
  '<div class="result-msg">'+(rate>=0.9?"强势：正确率 90%+，可挑战更高题量。":rate>=0.7?"良好：主干考点已掌握，重点回看错项陷阱拆解。":"重点突破：每道错题都附命题人陷阱拆解，逐条吸收后重练错题。")+'</div>'+
  '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">'+
    '<button class="btn btn-primary" id="againW">重练错题</button>'+
    '<button class="btn btn-blue" id="again">再练一组</button>'+
    '<button class="btn btn-ghost" id="goAtlas">查看考点图谱</button>'+
  '</div></div>'+
  '<div class="card"><h2><span class="bar"></span>逐题解析（含命题人陷阱拆解）</h2><div class="review-list">'+rows+'</div></div>'+
  '<div id="detail"></div>';
  document.getElementById("againW").onclick=()=>{let ids=Object.keys(S.w).map(Number);let pool=QB.filter((q,i)=>ids.includes(i));if(pool.length)startQuiz(pool);else alert("错题本暂无错题")};
  document.getElementById("again").onclick=()=>{S.view="setup";document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active",x.dataset.view==="setup"));render()};
  document.getElementById("goAtlas").onclick=()=>{S.view="atlas";document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active",x.dataset.view==="atlas"));render()};
  document.querySelectorAll("[data-ridx]").forEach(row=>row.onclick=()=>showDetail(+row.dataset.ridx));
  showDetail(0);
}
function showDetail(idx){
  let q=S.quiz[idx],my=S.answers[idx],ok=my===q.ans;
  let trapList=q.traps.map(t=>'<div class="trap-item"><span class="t-opt">干扰项 '+String.fromCharCode(65+t.o)+'（'+esc(q.opts[t.o])+'）</span><br><span class="t-why">'+esc(t.why)+'</span></div>').join("");
  let optsH=q.opts.map((o,i)=>{
    let cls=[];if(i===q.ans)cls.push("correct");if(i===my&&my!==q.ans)cls.push("wrong");if(i===my&&my===q.ans)cls.push("chosen");
    let flag=i===q.ans?'<span class="flag ok">正确答案</span>':(i===my?'<span class="flag no">你的选择</span>':"");
    return '<div class="option '+cls.join(" ")+'"><span class="k">'+String.fromCharCode(65+i)+'.</span><span class="t">'+esc(o)+'</span>'+flag+'</div>';
  }).join("");
  document.getElementById("detail").innerHTML=
  '<div class="q-card"><div class="q-head"><div class="q-num">'+(idx+1)+'</div><div style="flex:1"><div class="q-text">'+qHtml(q.q)+'</div><div class="q-meta"><span class="badge point">'+q.point+'</span><span class="badge zhen">'+q.src+'</span></div></div></div>'+
  '<div class="options">'+optsH+'</div>'+
  '<div class="explain-box">'+
    '<div class="ans-line '+(ok?"ok":"no")+'">你的答案：'+(my===undefined?"未作答":String.fromCharCode(65+my))+'　|　正确答案：'+String.fromCharCode(65+q.ans)+'（'+esc(q.opts[q.ans])+'）</div>'+
    '<div class="detail"><b>解题思路：</b>'+esc(q.solve)+'</div>'+
    '<div style="margin-top:8px"><b style="color:var(--blue)">命题人视角 · 干扰项拆解：</b>'+trapList+'</div>'+
  '</div>'+
  '<div class="key-line"><b>解题关键：</b>'+esc(q.key)+'</div>'+
  '<div class="orig-line"><b>出处核验：</b>'+esc(q.src)+(q.orig?'　｜　'+esc(q.orig):'　｜　按真题卷收录，答案经华图/粉笔/金标尺等多家机构交叉核对')+'</div>'+
  '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
    (idx>0?'<button class="btn btn-ghost" id="dPrev">上一题解析</button>':"")+
    (idx<S.quiz.length-1?'<button class="btn btn-blue" id="dNext">下一题解析</button>':"")+
  '</div></div>';
  let p=document.getElementById("dPrev");if(p)p.onclick=()=>showDetail(idx-1);
  let n=document.getElementById("dNext");if(n)n.onclick=()=>showDetail(idx+1);
  document.querySelectorAll("[data-ridx]").forEach(row=>row.classList.toggle("hl",+row.dataset.ridx===idx));
}
/* ===== 考点图谱 ===== */
function renderAtlas(){
  let acc={};POINTS.forEach(p=>acc[p]={n:0,c:0});
  S.h.forEach(r=>{
    if(r.qids){r.qids.forEach(x=>{let q=QB[x[0]];if(q){acc[q.point].n++;if(x[1])acc[q.point].c++}})}
  });
  let rows2=POINTS.map(p=>{let qs=QB.filter(q=>q.point===p);let a=acc[p];return {p,qs,n:a.n,c:a.c}});
  let maxN=Math.max(1,...rows2.map(r=>r.qs.length));
  let trs=rows2.map(r=>{
    let rate=r.n?r.c/r.n:null;
    let rateHtml=rate===null?'<span style="color:var(--sub)">未练习</span>':('<div class="bar-cell"><div class="bar"><i class="'+(rate>=0.8?"green":rate>=0.6?"":"red")+'" style="width:'+(rate*100)+'%"></i></div><div style="font-size:12px;margin-top:3px">'+Math.round(rate*100)+'%</div></div>');
    return '<tr><td class="pname">'+r.p+'</td><td style="text-align:center">'+r.qs.length+'</td><td style="text-align:center">'+r.n+'</td>'+'<td>'+rateHtml+'</td></tr>';
  }).join("");
  let chips=rows2.map(r=>{
    let rate=r.n?r.c/r.n:null;
    let cls=rate===null?"none":(rate>=0.8?"done":(rate>=0.6?"":"weak"));
    return '<span class="chip '+cls+'">'+r.p+'</span>';
  }).join("");
  app.innerHTML=
  '<div class="card"><h2><span class="bar"></span>考点图谱 · 覆盖与掌握度</h2>'+
  '<div class="kp-legend"><span><span class="dot" style="background:var(--green)"></span>掌握（≥80%）</span><span><span class="dot" style="background:var(--accent)"></span>练习中（60-80%）</span><span><span class="dot" style="background:var(--red)"></span>薄弱（&lt;60%）</span><span><span class="dot" style="background:var(--amber)"></span>未练习</span></div>'+
  '<table class="kp-table"><tr><th>考点</th><th style="width:60px">题数</th><th style="width:60px">已练</th><th>正确率</th></tr>'+trs+'</table>'+
  '<div class="cover-all">'+chips+'</div>'+
  '<div class="result-msg" style="margin-top:10px">题数=题库中该考点题目数；正确率=历次练习中该考点题目正确比例（基于完整作答记录）。</div></div>';
}
/* ===== 统计页 ===== */
function renderStats(){
  let tot=S.h.length,tq=0,tc=0,tsec=0;
  S.h.forEach(r=>{tq+=r.total;tc+=r.correct;tsec+=r.secs});
  let rate=tq?Math.round(tc/tq*100):0;
  let byY={};S.h.forEach(r=>{r.years.forEach(y=>{byY[y]=byY[y]||{n:0,c:0};byY[y].n+=r.total;byY[y].c+=r.correct})});
  let yRows=Object.keys(byY).sort().map(y=>{
    let d=byY[y],r=Math.round(d.c/d.n*100);
    return '<li><span class="when">'+y+' 年</span><span class="score '+(r>=80?"hi":r<60?"lo":"")+'">'+r+'%</span><span class="det">'+d.c+'/'+d.n+' 题</span></li>';
  }).join("");
  let hRows=S.h.slice().reverse().map((r,i)=>{
    let r2=Math.round(r.correct/r.total*100);
    let d=new Date(r.t),ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    return '<li><span class="when">'+ds+'</span><span class="score '+(r2>=80?"hi":r2<60?"lo":"")+'">'+r2+'%</span><span class="det">'+r.correct+'/'+r.total+' · '+fmt(r.secs)+' · '+(r.years||[]).join("/")+'年</span></li>';
  }).join("");
  let wCnt=Object.keys(S.w).length;
  app.innerHTML=
  '<div class="stat-cards">'+
    '<div class="stat-card"><div class="v">'+tot+'</div><div class="l">练习次数</div></div>'+
    '<div class="stat-card"><div class="v accent">'+tq+'</div><div class="l">累计答题</div></div>'+
    '<div class="stat-card"><div class="v">'+rate+'%</div><div class="l">累计正确率</div></div>'+
    '<div class="stat-card"><div class="v">'+wCnt+'</div><div class="l">错题总数</div></div>'+
  '</div>'+
  '<div class="card"><h2><span class="bar"></span>分年份正确率</h2><ul class="hist-list">'+(yRows||'<li style="color:var(--sub)">暂无练习记录</li>')+'</ul></div>'+
  '<div class="card"><h2><span class="bar"></span>历史练习记录</h2><ul class="hist-list">'+(hRows||'<li style="color:var(--sub)">暂无练习记录，去设置页开始第一组吧</li>')+'</ul></div>';
}
/* ===== 错题本 ===== */
function renderWrong(){
  let ids=Object.keys(S.w).map(Number).sort((a,b)=>S.w[b]-S.w[a]);
  if(!ids.length){
    app.innerHTML='<div class="card"><h2><span class="bar"></span>错题本</h2><div class="empty-tip">暂无错题。坚持练习，把每道错题的陷阱拆解吃透。 </div></div>';
    return;
  }
  let items=ids.map(id=>{
    let q=QB[id];
    if(!q)return"";
    let trapList=q.traps.map(t=>'<div class="trap-item"><span class="t-opt">干扰项 '+String.fromCharCode(65+t.o)+'（'+esc(q.opts[t.o])+'）</span><br><span class="t-why">'+esc(t.why)+'</span></div>').join("");
    return '<div class="wrong-item"><div class="w-top"><span class="badge point">'+q.point+'</span><span class="badge zhen">'+q.src+'</span><span class="w-note">错 <b>'+S.w[id]+'</b> 次</span></div>'+
    '<div class="w-q">'+qHtml(q.q)+'</div>'+
    '<div class="w-note">正确答案：<b style="color:var(--green)">'+String.fromCharCode(65+q.ans)+'. '+esc(q.opts[q.ans])+'</b></div>'+
    '<details><summary>展开：解题思路 + 命题人陷阱拆解</summary><div class="explain-box" style="margin-top:8px">'+
      '<div class="detail"><b>解题思路：</b>'+esc(q.solve)+'</div>'+
      '<div style="margin-top:8px"><b style="color:var(--blue)">命题人视角 · 干扰项拆解：</b>'+trapList+'</div>'+
    '</div><div class="key-line"><b>解题关键：</b>'+esc(q.key)+'</div></details></div>';
  }).join("");
  app.innerHTML=
  '<div class="card"><div class="wrong-head"><h2 style="margin-bottom:0"><span class="bar"></span>错题本（共 '+ids.length+' 题）</h2>'+
  '<div style="display:flex;gap:8px"><button class="btn btn-primary" id="reW">重练全部错题</button><button class="btn btn-ghost" id="clrW">清空错题本</button></div></div>'+
  '<div style="margin-top:10px">'+items+'</div></div>';
  document.getElementById("reW").onclick=()=>{let pool=QB.filter((q,i)=>ids.includes(i));if(pool.length)startQuiz(pool)};
  document.getElementById("clrW").onclick=()=>{if(confirm("确认清空错题本？")){S.w={};save();render()}};
}
/* 首次渲染 */
render();
</script>
</body>
</html>
